name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Simulates a standard Python environment where dependencies are installed via pip.
  # Validates that the app works regardless of how dependencies are resolved at install time.
  test-pip-installed:
    name: "pip-installed / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

    # Simulates how Splunk uses the app: dependencies are NOT installed via pip.
    # Instead, only the packages pre-bundled in sekoia.io/lib/py3/ are available,
    # injected via PYTHONPATH — exactly as Splunk resolves imports at runtime.
    # This catches breakage caused by incompatible bundled packages on a given Python version.
    test-bundled-packages:
      name: "bundled-packages / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner only (no app dependencies — all bundled in lib/py3)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

        - name: Run tests against bundled packages
        env:
          # Point Python to the embedded lib/py3 directory instead of site-packages,
          # so imports resolve exclusively from the pre-bundled packages.
          PYTHONPATH: sekoia.io/lib/py3
        run: pytest tests/ -v
